<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order confirmation | Relixsx Store</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1533;--orbit:#16706B;--signal:#FFB627;--star:#94A4C6;
--d:"Bricolage Grotesque",system-ui,sans-serif;--b:"Public Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--b);background:var(--ink);color:#fff;min-height:100vh;
display:grid;place-items:center;padding:28px 20px;line-height:1.55}
.card{max-width:520px;width:100%}
h1{font-family:var(--d);font-size:34px;letter-spacing:-.025em;margin-bottom:8px}
.sub{color:var(--star);margin-bottom:28px}
.mark{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
font-size:36px;margin-bottom:20px}
.ok{background:rgba(95,211,196,.16);border:2px solid #5FD3C4}
.bad{background:rgba(255,122,122,.14);border:2px solid #FF7A7A}
.box{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);
border-radius:20px;padding:20px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;
border-bottom:1px solid rgba(255,255,255,.07);font-size:14.5px;color:#C3CEE6}
.row:last-child{border-bottom:0}
.row b{color:#fff;text-align:right}
.num{font-family:var(--d);font-size:26px;color:var(--signal);letter-spacing:-.01em}
.paid{display:inline-block;background:rgba(95,211,196,.16);color:#5FD3C4;
border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700;letter-spacing:.08em}
.btn{display:block;text-align:center;text-decoration:none;font-family:var(--d);
font-weight:800;padding:17px;border-radius:999px;font-size:16.5px;margin-top:12px;
cursor:pointer;border:0;width:100%}
.primary{background:var(--signal);color:var(--ink)}
.ghost{background:rgba(255,255,255,.09);color:#fff}
.muted{color:var(--star);font-size:13px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="card" id="root">
  <div class="box" style="text-align:center">
    <p style="color:var(--star)">Confirming your payment...</p>
  </div>
</div>

<script>
var API_BASE = "http://localhost:8000";

function money(k){ return "\u20a6" + (k/100).toLocaleString("en-NG") }
function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML }

function fail(title, msg){
  document.getElementById("root").innerHTML =
    '<div class="mark bad">!</div><h1>' + esc(title) + '</h1>' +
    '<p class="sub">' + esc(msg) + '</p>' +
    '<a class="btn ghost" href="index.html">Back to the store</a>';
}

(async function(){
  var q = new URLSearchParams(location.search);
  var ref = q.get("reference") || q.get("trxref");
  if(!ref){ return fail("No order found", "This page was opened without a payment reference."); }

  try{
    /* The server asks Paystack directly. Landing on this page proves nothing. */
    var res = await fetch(API_BASE + "/api/orders/" + encodeURIComponent(ref) + "/verify");
    var o = await res.json();
    if(!res.ok) throw new Error(o.detail || "Could not confirm this order.");

    if(o.payment_status !== "PAID"){
      return fail("Payment not completed",
        "Your order " + ref + " is saved but not paid. You can try the payment again.");
    }

    document.getElementById("root").innerHTML =
      '<div class="mark ok">\u2713</div>' +
      '<h1>Payment successful</h1>' +
      '<p class="sub">Thank you. Your order has been received.</p>' +
      '<div class="box">' +
        '<div class="row"><span>Order number</span><b class="num">' + esc(o.order_number) + '</b></div>' +
        '<div class="row"><span>Product</span><b>' + esc(o.product) + '</b></div>' +
        '<div class="row"><span>Quantity</span><b>' + esc(o.quantity) + '</b></div>' +
        (o.lunchbox ? '<div class="row"><span>Lunch box</span><b>' + esc(o.lunchbox) + '</b></div>' : '') +
        '<div class="row"><span>Delivery</span><b>Free nationwide</b></div>' +
        '<div class="row"><span>Total paid</span><b>' + money(o.total_kobo) + '</b></div>' +
        '<div class="row"><span>Deliver to</span><b>' + esc(o.full_name) + '<br>' +
           esc(o.city) + ', ' + esc(o.lga) + '<br>' + esc(o.state) + '</b></div>' +
        '<div class="row"><span>Status</span><b><span class="paid">PAID</span></b></div>' +
      '</div>' +
      '<button class="btn primary" id="copy">Copy order number</button>' +
      '<p class="muted">Keep your order number. Quote it in any message about this order.</p>';

    document.getElementById("copy").addEventListener("click", function(){
      navigator.clipboard.writeText(o.order_number);
      this.textContent = "Copied \u2713";
    });

    /* Fire Purchase once only, so a page refresh cannot double count it. */
    if(window.fbq && !sessionStorage.getItem("p_" + o.order_number)){
      fbq("track","Purchase",{value:o.total_kobo/100, currency:"NGN"});
      sessionStorage.setItem("p_" + o.order_number, "1");
    }
  }catch(e){
    fail("We could not confirm this yet",
      "If money left your account, your order is safe. Quote reference " + ref + " when you contact us.");
  }
})();
</script>
</body>
</html>
